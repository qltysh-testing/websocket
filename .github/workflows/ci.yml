name: ci
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
      - run: make fmt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: go version
      - uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Disable AppArmor
        if: runner.os == 'Linux'
        run: |
          # Disable AppArmor for Ubuntu 23.10+.
          # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
      - run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: coverage.html
          path: ./ci/out/coverage.html
      - name: Name the coverage profile so Qlty detects the Go format
        run: cp ./ci/out/coverage.prof ./ci/out/coverage.out
      - name: Upload coverage to Qlty
        # Secrets are unavailable to pull requests from forks.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: ./ci/out/coverage.out
          # Go coverage profiles record import paths, not repository paths.
          strip-prefix: github.com/coder/websocket

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
      - run: make bench
